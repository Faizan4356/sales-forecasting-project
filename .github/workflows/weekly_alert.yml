# Example: run the weekly Sales Intelligence report every Monday morning.
#
# This workflow generates weekly_alert_report.md and uploads it as a build
# artifact. It does NOT email or post to Slack -- that requires credentials
# (an SMTP/SendGrid/SES key, or a Slack webhook URL) that this repo doesn't
# have configured. To wire that up:
#   1. Add the credential as a repo secret (Settings -> Secrets and
#      variables -> Actions), e.g. SLACK_WEBHOOK_URL.
#   2. Add a step after "Run weekly pipeline" below, e.g.:
#        - name: Post to Slack
#          run: |
#            curl -X POST -H 'Content-type: application/json' \
#              --data "{\"text\": $(python -c 'import json,sys; print(json.dumps(open("weekly_alert_report.md").read()))')}" \
#              "${{ secrets.SLACK_WEBHOOK_URL }}"
# Never hardcode a webhook URL or API key directly in this file.

name: Weekly Sales Intelligence Report

on:
  schedule:
    - cron: "0 8 * * 1"  # 08:00 UTC every Monday
  workflow_dispatch: {}   # allows a manual trigger from the Actions tab

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-offline.txt

      - name: Run weekly pipeline
        run: |
          python sales_forecast_phase2.py
          python train_anomaly_model.py
          python generate_and_analyze_reviews.py
          python combine_store_health.py
          python generate_portfolio_forecast.py
          python generate_weekly_alert.py

      - name: Upload report as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: weekly-alert-report
          path: weekly_alert_report.md

      # Commits store_health_scores_previous.csv back to the repo so NEXT
      # week's run can detect tier changes against this week's snapshot --
      # GitHub Actions runners are ephemeral, so without this the
      # tier-drop comparison would never have anything to compare against.
      - name: Commit health snapshot for next week's comparison
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add store_health_scores_previous.csv
          git diff --staged --quiet || git commit -m "Update weekly health snapshot [skip ci]"
          git push
